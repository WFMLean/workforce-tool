<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workforce Tool</title>
<!-- Design A · "Command". Prototype on synthetic data; see workforce-core.js for the integration notes. -->
<style>
:root{
  --bg:#030712; --bg2:#070d1a; --panel:#0b1324; --panel2:#0f1a2f; --line:#1a2740; --line2:#25365a;
  --ink:#eef3fa; --ink2:#9fb0c8; --ink3:#6c7d97;
  --acc:#0bd1ff; --acc-ink:#04131c; --pri:#006EF2; --pri2:#0a5fd0;
  --ok:#3ccf91; --oks:rgba(60,207,145,.13); --warn:#f5b84a; --warns:rgba(245,184,74,.14); --bad:#ff6b77; --bads:rgba(255,107,119,.14); --info:#6aa8ff; --infos:rgba(106,168,255,.14);
  --e:#1aa6b7; --d:#2f6fe0; --m:#6a5ae0; --a:#a557d6; --n:#46566f;
  --serif:ui-serif,Georgia,Cambria,"Times New Roman",serif; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f5f7fb; --bg2:#eef2f8; --panel:#ffffff; --panel2:#f8fafd; --line:#e2e8f0; --line2:#cfd8e6;
  --ink:#0b1220; --ink2:#475569; --ink3:#7b8aa3; --acc:#006EF2; --acc-ink:#fff;
  --oks:#e3f6ee; --ok:#0f8a5a; --warns:#fdf2dc; --warn:#a46a00; --bads:#fde6e8; --bad:#c62f3d; --infos:#e6efff; --info:#2059c9;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n{font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right}
h1{font:300 30px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
h1 b{font-weight:600;color:var(--acc)}
h1 i{font-style:italic}
h2{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--ink3);font-size:12.5px;margin:2px 0 0}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ----- sign in (LeanTek style) ----- */
.signin{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.si-art{position:relative;padding:48px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden;
  background:radial-gradient(120% 70% at 30% 35%,#2a4d5a 0%,#173040 38%,#0d1a2c 70%),linear-gradient(180deg,#14303a,#1a2b52)}
.si-art::after{content:"";position:absolute;inset:auto -10% -20% -10%;height:60%;background:radial-gradient(60% 60% at 40% 60%,rgba(40,70,140,.55),transparent 70%)}
.si-art>*{position:relative;z-index:1}
.si-logo{font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.si-logo span{font-weight:300}
.mark{width:26px;height:22px;display:inline-block}
.si-copy h2{font:300 40px/1.18 var(--serif);margin:0 0 18px;letter-spacing:-.01em}
.si-copy h2 b{font-weight:600;color:#a5f0ff}
.si-copy h2 i{color:#d8e5ff}
.si-copy p{font-size:17px;color:#dbe6f5;max-width:460px;margin:0 0 6px;opacity:.9}
.si-copy small{letter-spacing:.08em;color:#9fb3cf;font-size:12px}
.si-form{background:var(--bg);display:grid;place-items:center;padding:32px;position:relative}
.si-box{width:min(380px,100%)}
.si-box h1{font:600 28px/1.2 var(--sans);letter-spacing:-.02em}
.si-box h1 span{color:var(--acc)}
.ms{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;border-radius:var(--r);border:0;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;margin:26px 0 12px;box-shadow:0 8px 24px -10px rgba(0,110,242,.8)}
.ms:hover{background:var(--pri2)}
.ms svg{width:18px;height:18px;background:#fff;padding:2px;border-radius:4px}
.si-note{font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.si-pow{text-align:center;margin-top:46px;font-size:11px;letter-spacing:.14em;color:rgba(11,209,255,.55)}
.si-pow b{display:block;color:var(--ink2);letter-spacing:0;font-size:16px;margin-top:8px}
.iconbtn{position:absolute;top:22px;right:22px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);cursor:pointer;display:grid;place-items:center}

/* ----- shell ----- */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.app>div{min-width:0}
.side{border-right:1px solid var(--line);background:var(--bg2);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.side .si-logo{padding:2px 8px 20px;font-size:16px;color:var(--ink)}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink2);font-weight:500;text-align:left}
.nav:hover{background:var(--panel)}
.nav.on{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--acc)}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--pri);color:#fff;border-radius:99px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:10px;border-top:1px solid var(--line)}
.side .foot a{color:var(--acc);text-decoration:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap}
.top .sp{flex:1}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.6;margin-left:4px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--ink2);white-space:nowrap;border:0}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--oks);color:var(--ok)} .pill.warn{background:var(--warns);color:var(--warn)} .pill.bad{background:var(--bads);color:var(--bad)} .pill.info{background:var(--infos);color:var(--info)} .pill.muted{color:var(--ink3)}
button.pill{cursor:pointer}
.user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#1d3a63,#0f6b8a);color:#dff6ff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
main{padding:22px 26px 60px;min-width:0}
.head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.head .grow{flex:1;min-width:260px}

/* ----- primitives ----- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h .grow{flex:1;min-width:180px}
.cols{display:grid;gap:14px}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c21{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.c12{grid-template-columns:minmax(300px,.9fr) minmax(0,1.6fr)}
.stack{display:flex;flex-direction:column;gap:14px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px;overflow:hidden}
.strip>div{padding:12px 16px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip .l{font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.strip .v{font:600 24px/1.2 var(--sans);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.strip .h{font-size:11.5px;color:var(--ink3)}
.v.bad{color:var(--bad)} .v.warn{color:var(--warn)} .v.ok{color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.bad{color:var(--bad)} .btn.ok{color:var(--ok)}
.btn.sm{min-height:28px;padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.in{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;min-height:34px;width:100%}
select.in{width:auto}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
.field{margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:2px;gap:2px}
.seg button{white-space:nowrap;border:0;background:none;padding:4px 10px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;color:var(--ink2)}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td.num{white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.sel td{background:var(--panel2)}
tr.tot td{font-weight:700;border-top:1px solid var(--line2)}
.nm{font-weight:600;white-space:nowrap}
.nowrap{white-space:nowrap}
.meta{font-size:12px;color:var(--ink3)}
.empty{color:var(--ink3);text-align:center;padding:28px 10px}
.note{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--acc);padding:6px 10px;background:var(--panel2);border-radius:0 8px 8px 0}
.note.bad{border-color:var(--bad)} .note.warn{border-color:var(--warn)}
.q{font:italic 300 14px/1.5 var(--serif);color:var(--ink2);border-left:2px solid var(--line2);padding-left:10px;margin:8px 0}
.foot-note{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.55}

/* shift codes & absence tags */
.sc{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
.sc-E{background:var(--e)} .sc-D{background:var(--d)} .sc-M{background:var(--m)} .sc-A{background:var(--a)} .sc-N{background:var(--n)} .sc-OFF{background:transparent;color:var(--ink3)}
.ab{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 4px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.ab.pl{background:var(--infos);color:var(--info);box-shadow:inset 0 0 0 1px currentColor}
.ab.un{background:var(--bads);color:var(--bad);box-shadow:inset 0 0 0 1px currentColor}

/* schedule grid */
.grid td,.grid th{padding:4px;text-align:center}
.grid td:first-child,.grid th:first-child{text-align:left;padding-left:8px;position:sticky;left:0;background:var(--panel);z-index:1;min-width:190px}
.grid td.cell{cursor:pointer;position:relative;min-width:42px;border-left:1px solid var(--line)}
.grid td.cell:hover{background:var(--panel2)}
.grid td.cell.today,.grid th.today{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.grid td.cell .dot{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.grid td.cell .chg{position:absolute;bottom:2px;right:4px;font-size:9px;color:var(--acc);font-weight:700}
.wk{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.05em}
.grid tr.sub td{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;border-left:1px solid var(--line)}
.grid tr.sub td:first-child{color:var(--ink3);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.grid input[type=checkbox]{margin-right:6px}
/* heatmap */
.heat td.hc{text-align:center;font-weight:700;font-size:12px;cursor:pointer;border:2px solid var(--panel);border-radius:8px;min-width:46px;padding:8px 2px;font-variant-numeric:tabular-nums}
.hc.ok{background:color-mix(in srgb,var(--ok) 30%,transparent)} .hc.tight{background:color-mix(in srgb,var(--warn) 34%,transparent)} .hc.short{background:color-mix(in srgb,var(--bad) 45%,transparent)} .hc.closed{color:var(--ink3);background:var(--bg2);font-weight:400}
.heat tr.selrow td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.heat td:first-child{white-space:nowrap;padding-right:12px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* hourly strip */
.hs{display:grid;grid-template-columns:repeat(24,1fr);gap:2px}
.hs span{height:24px;border-radius:4px;font-size:10px;display:grid;place-items:center;font-weight:600;font-variant-numeric:tabular-nums}
.hs .cl{background:var(--bg2)} .hs .lo{background:color-mix(in srgb,var(--bad) 55%,transparent);color:#fff} .hs .md{background:color-mix(in srgb,var(--warn) 35%,transparent)} .hs .hi{background:color-mix(in srgb,var(--ok) 28%,transparent)}
.hs .hl{box-shadow:inset 0 -3px 0 var(--acc)}
.hs-ax{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:2px}
/* timeline */
.tl{position:relative;height:16px;background:var(--bg2);border-radius:5px;min-width:160px}
.tl i{position:absolute;top:0;bottom:0;border-radius:5px}
.tl .tl-sch{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.tl .tl-log{top:4px;bottom:4px;background:var(--ok);border-radius:3px}
.tl .tl-log.late{background:var(--warn)}
.tl .tl-act{top:1px;bottom:1px;background:color-mix(in srgb,var(--info) 35%,transparent)}
.tl .tl-now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--acc)}
.tl-axis{position:relative;height:14px;font-size:9.5px;color:var(--ink3)}
.tl-axis b{position:absolute;font-weight:500;transform:translateX(-50%)}
/* request list */
.rq{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rq:hover{border-color:var(--line2)}
.rq.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.rq .top2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--acc)}
.bar b.un{background:var(--bad)}
/* drawer & toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line2);z-index:41;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{flex:1;font:400 20px/1.2 var(--serif)}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0 0 14px;font-size:13px}
dl.kv dt{color:var(--ink3)} dl.kv dd{margin:0}
.wkpat{display:grid;grid-template-columns:18px repeat(7,1fr);gap:3px;font-size:10.5px;align-items:center;margin:4px 0}
.wkpat b{color:var(--ink3);font-weight:600}
.sc-X{background:#b7791f}
.navsec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:14px 10px 4px}
.linkbtn{border:0;background:none;color:var(--acc);cursor:pointer;font-size:13px;padding:6px 0;display:block;margin:0 auto 18px}
.alarm{border:1px solid color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--panel));border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.alarm.clear{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 6%,var(--panel))}
.alarm h2{display:flex;align-items:center;gap:8px}
.alarm h2 .cntb{background:var(--bad);color:#fff;border-radius:99px;padding:1px 9px;font-size:12px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(255,107,119,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,107,119,0)}100%{box-shadow:0 0 0 0 rgba(255,107,119,0)}}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs2 button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--ink);border-color:var(--acc)}
.opt{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--panel)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.opt b{display:block;margin-bottom:2px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.card-prev{border:1px solid var(--line2);border-radius:12px;padding:14px;background:var(--bg2);font-size:12.5px}
.card-prev h3{margin:0 0 6px;font-size:14px}
.spark{vertical-align:middle}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.pw{font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.06em;background:var(--bg2);border:1px dashed var(--acc);border-radius:10px;padding:10px 14px;text-align:center;margin:10px 0}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ex{border:0;border-radius:10px;padding:14px 12px;color:#fff;text-align:center;cursor:pointer;box-shadow:0 6px 16px -10px rgba(0,0,0,.6);font:inherit}
.ex b{display:block;font-size:14px}
.ex span{font-size:11px;opacity:.75}
.ex.planned{background:#1f3a68}
.ex.unplanned{background:#9e2a2f}
.ex:disabled{cursor:default}
.pt-times td,.pt-times th{padding:3px}
.pt-times .in{min-height:30px;padding:3px 6px}
.sc{min-width:58px;white-space:nowrap}
.grid td.cell{min-width:66px}
.grid td.cell.proj .sc{opacity:.55;outline:1.5px dashed var(--ink3);outline-offset:1px}
.grid th.proj{color:var(--ink3);font-style:italic}
.offc{font-size:11px;color:var(--ink2);white-space:nowrap;text-align:left!important}
.offc b{color:var(--ink);font-weight:600}
.srcbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink2)}
.srcbar b{color:var(--ink)}
.srcbar .sp{flex:1}
.fd-ms{fill:color-mix(in srgb,var(--info) 14%,var(--panel));stroke:var(--info)}
.fd-pa{fill:color-mix(in srgb,var(--acc) 12%,var(--panel));stroke:var(--acc)}
.fd-db{fill:color-mix(in srgb,var(--ok) 14%,var(--panel));stroke:var(--ok)}
.fd-app{fill:color-mix(in srgb,var(--pri) 22%,var(--panel));stroke:var(--pri)}
.fd-t{fill:var(--ink);font-size:13px;font-weight:600}

<script>
/* =====================================================================
   Workforce Tool — shared engine (prototype)
   Synthetic data only. Nothing here talks to Microsoft, Teams, Shifts or a database.

   Production wiring this engine stands in for:
   - Schedules  → Microsoft Graph /teams/{id}/schedule/shifts  (create/replace/delete)
   - PTO        ← Teams / Shifts timeOffRequests; decisions → approve / decline
   - Logins     ← Shifts time clock (timeCards) or the account's ACD/phone login export
   - Audit      → append-only server table; every change written with user + before/after
   ===================================================================== */
(function (global) {
'use strict';

/* ---------- utilities ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffD = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dow = s => (parse(s).getDay() + 6) % 7;                       // Mon = 0
const range = (a, b) => { const o = []; for (let d = a; d <= b; d = addD(d, 1)) o.push(d); return o; };
const weekStart = s => addD(s, -dow(s));
const hm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtD = (s, o) => parse(s).toLocaleDateString('en-US', o || { weekday: 'short', month: 'short', day: 'numeric' });
const fmtS = s => parse(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const hashKey = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 2246822507); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
let seed = 41;
const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(R() * a.length)];
const pct = (n, d) => d ? n / d * 100 : null;
const fmtPct = (v, dp = 1) => v == null || isNaN(v) ? '—' : v.toFixed(dp) + '%';
const dur = m => m < 60 ? `${Math.round(m)} min` : `${Math.floor(m / 60)} h ${pad(Math.round(m % 60))}`;
const initials = n => n.split(' ').map(w => w[0]).slice(0, 2).join('');

const NOW = new Date();
const TODAY = iso(NOW);
const realMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const stamp = () => TODAY + ' ' + hm(realMin());

/* ---------- reference data ---------- */
const ME = { name: 'J. Rodríguez', role: 'Admin', email: 'j.rodriguez@leangroup.com', scope: ['all'] };
const RTAS = ['R. Ortega', 'M. Cruz', 'L. Santos'];
const SYSTEM = 'Teams sync';

const ACCOUNTS = [
  { id: 'CRN', name: 'Crane', site: 'BAQ', team: 'Crane Worldwide Logistics', teamId: '7fd45419-003c-4a9f-b2c3-1b88c7b65702', absTarget: 7, adhTarget: 96,
    lobs: [{ id: 'IAH', hc: 20, minInt: 4 }, { id: 'MIA', hc: 16, minInt: 3 }, { id: 'LAX', hc: 12, minInt: 2 }] },
  { id: 'ONT', name: 'OnTrac', site: 'BAQ', team: 'OnTRAC', teamId: 'c6cb7bb2-8512-483d-8c67-fecbecf31ed2', absTarget: 7, adhTarget: 95,
    lobs: [{ id: 'Support', hc: 18, minInt: 4 }, { id: 'Claims', hc: 10, minInt: 2 }] }
  // Caliber (Shifts team "WFM - Caliber") is left out for now, per JM 2026-10-06
];
const ACC = Object.fromEntries(ACCOUNTS.map(a => [a.id, a]));
const LOCNAME = { BAQ: 'Barranquilla', GUA: 'Guatemala', MNL: 'Manila', MDE: 'Medellín' }, LOCSHORT = { Barranquilla: 'BAQ', Guatemala: 'GUA', Manila: 'MNL', 'Medellín': 'MDE' };
const LOCF = { v: 'all' };                              // global location filter (LSG Branch)
const LOBS = ACCOUNTS.flatMap(a => a.lobs.map(l => ({ acc: a.id, lob: l.id, key: a.id + '|' + l.id, hc: l.hc, minInt: l.minInt, name: `${a.name} · ${l.id}`, site: LOCNAME[a.site] || a.site, station: l.id })));
const LOB = Object.fromEntries(LOBS.map(l => [l.key, l]));

/* Shift templates (8 paid hours + 30 min unpaid break) */
const SHIFTS = {
  E: { name: 'Early', s: 360, e: 870 }, D: { name: 'Day', s: 480, e: 990 }, M: { name: 'Mid', s: 600, e: 1110 },
  A: { name: 'Late', s: 840, e: 1350 }, N: { name: 'Night', s: 1320, e: 1830 }, OFF: { name: 'Off' }
};
const shiftLabel = c => c === 'OFF' ? 'Off' : `${hm(SHIFTS[c].s)}–${hm(SHIFTS[c].e)}`;
const tShort = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return h + (mm ? ':' + pad(mm) : ''); };
const shiftShort = c => c === 'OFF' ? 'Off' : `${tShort(SHIFTS[c].s)}–${tShort(SHIFTS[c].e)}`;

/* 2-week patterns: Week A (Mon–Sun) then Week B (Mon–Sun) */
const PATTERNS = {
  P1: { name: 'Early · Mon–Fri', w: ['E','E','E','E','E','OFF','OFF', 'E','E','E','E','E','OFF','OFF'] },
  P2: { name: 'Day · alternate Saturday', w: ['D','D','D','D','D','OFF','OFF', 'D','D','OFF','D','D','D','OFF'] },
  P3: { name: 'Early / Late rotation', w: ['E','E','E','E','E','OFF','OFF', 'A','A','A','A','A','OFF','OFF'] },
  P4: { name: 'Mid · Sun–Thu', w: ['M','M','M','M','OFF','OFF','M', 'M','M','M','M','M','OFF','OFF'] },
  P5: { name: 'Late · weekend rotation', w: ['A','A','A','OFF','OFF','A','A', 'OFF','A','A','A','A','A','OFF'] },
  P6: { name: 'Night · Sun–Thu', w: ['N','N','N','N','OFF','OFF','N', 'N','N','N','N','N','OFF','OFF'] },
  NONE: { name: 'No schedule', w: Array(14).fill('OFF'), none: true },
  CAP: { name: 'Captured from Shifts', w: Array(14).fill('OFF'), none: true }
};
const ANCHOR = '2026-01-05'; // Monday of a Week A
const PAT_BY_LOB = { 'CRN|IAH': ['P2','P4','P5'], 'CRN|MIA': ['P2','P5'], 'CRN|LAX': ['P5','P6'], 'ONT|Support': ['P2','P4'],
  'ONT|Claims': ['P1','P3'] };

/* Starting absence reasons. Administrators can add tool reasons and adjust counting rules.
   Adding a tool reason does not create a native reason in Microsoft Teams Shifts. */
const REASONS = [
  { k: 'Unjustified Leave', code: 'UJL', type: 'unplanned', abs: true, slot: false },
  { k: 'School obligation as guardian', code: 'SCH', type: 'planned', abs: true, slot: true },
  { k: 'Holiday/VTO', code: 'VTO', type: 'planned', abs: false, slot: false },
  { k: 'Serious domestic calamity', code: 'SDC', type: 'unplanned', abs: true, slot: false },
  { k: 'Parental Leave', code: 'PAR', type: 'planned', abs: false, slot: false },
  { k: 'Medical leave', code: 'MDL', type: 'unplanned', abs: true, slot: false },
  { k: 'LSG Rest Day', code: 'LRD', type: 'planned', abs: false, slot: false, rest: true },
  { k: 'Early Out', code: 'EO', type: 'unplanned', abs: true, slot: false, partial: true },
  { k: 'Paid PTO', code: 'PTO', type: 'planned', abs: true, slot: true },
  { k: 'Vacation', code: 'VAC', type: 'planned', abs: true, slot: true },
  { k: 'Personal time-off', code: 'PER', type: 'planned', abs: true, slot: true },
  { k: 'Late in', code: 'LI', type: 'unplanned', abs: true, slot: false, partial: true },
  { k: 'Mandatory Rest Day', code: 'MRD', type: 'planned', abs: false, slot: false, rest: true },
  { k: 'Bereavement leave', code: 'BRV', type: 'unplanned', abs: true, slot: false },
  { k: 'Medical Appointment', code: 'MAP', type: 'planned', abs: true, slot: true },
  { k: 'Voter leave', code: 'VOT', type: 'planned', abs: true, slot: false },
  { k: 'Voting juror leave', code: 'JUR', type: 'planned', abs: true, slot: false },
  { k: 'Legal Summon', code: 'LGL', type: 'unplanned', abs: true, slot: false }
];
const RCFG = Object.fromEntries(REASONS.map(r => [r.k, r]));
const RTYPE = Object.fromEntries(REASONS.map(r => [r.k, r.type]));
const rcode = r => (RCFG[r] || {}).code || String(r).slice(0, 3).toUpperCase();
const fullOff = s => !!(s.absence && !(RCFG[s.absence.reason] || {}).partial);      // partial (Late in / Early Out) keeps the agent on shift
const LEGACY_REASONS = [{ k: 'Sick', records: 4, source: 'Shifts · old time-off reason' }, { k: 'Emergency', records: 2, source: 'Teams request typed by agent' }];
const ACTIVITIES = ['Training', 'Coaching 1:1', 'Team meeting', 'Nesting', 'System outage', 'Overtime'];
const REMARKS = {
  'Medical leave': ['Called in 05:40 via Teams, fever', 'Stomach flu, medical certificate to follow', 'Migraine, informed TL by phone', 'Sent medical certificate in Teams', 'Flu symptoms, will update tomorrow'],
  'Serious domestic calamity': ['Flooding in neighbourhood, no transport', 'House fire next door, family evacuated', 'Child hospitalised, no cover at home'],
  'Unjustified Leave': ['No contact; TL called twice', 'No response on Teams or phone', 'Reached at 11:00, no valid reason'],
  'Late in': ['Traffic on Vía 40, ETA 25 min', 'Power cut at home, reconnecting', 'Bus breakdown'],
  'Early Out': ['Left 1 h early, child pickup', 'Felt unwell, TL approved'],
  'Bereavement leave': ['Grandmother passed away', 'Funeral out of town'],
  'Legal Summon': ['Court hearing 09:00, summons on file'],
  Vacation: ['Family trip', 'Annual leave', 'Wedding', ''], 'Paid PTO': ['PTO balance', ''], 'Personal time-off': ['Moving house', 'Bank appointment', ''],
  'Medical Appointment': ['Dentist 9:00', 'Specialist visit', 'Lab tests'], 'School obligation as guardian': ['Parent-teacher meeting', 'School enrolment'],
  'Holiday/VTO': ['VTO offered, low volume'], 'Parental Leave': ['Paternity leave'], 'Mandatory Rest Day': ['Compensatory rest after OT'], 'LSG Rest Day': [''],
  'Voter leave': ['Regional elections'], 'Voting juror leave': ['Polling station juror']
};

/* settings */
const CFG = { autoPublish: true, grace: 5, lateRule: 'gt', loginSource: 'Shifts time clock', reqPct: 0.85, horizonWeeks: 6 };

/* ---------- agents ---------- */
const FIRST = ['Ana','Luis','María','Carlos','Sofía','Diego','Valeria','Andrés','Camila','Jorge','Paola','Mateo','Lucía','Daniel','Gabriela','Kevin','Rosa','Miguel','Laura','Esteban','Natalia','Oscar','Elena','Iván','Karla','Hugo','Mónica','Felipe','Diana','Ricardo','Juliana','Sergio','Adriana','Tomás','Isabel','Fernando','Marcela','Javier','Silvia','Héctor'];
const LAST = ['Gómez','Pérez','Rodríguez','Martínez','López','Díaz','Castro','Morales','Rojas','Herrera','Vargas','Ramos','Santos','Reyes','Cruz','Flores','Mendoza','Navarro','Ortega','Suárez','Jiménez','Torres','Ruiz','Molina','Aguilar','Salazar','Cárdenas','Pineda','Escobar','Montoya'];
const used = new Set();
const newName = () => { for (;;) { const n = pick(FIRST) + ' ' + pick(LAST); if (!used.has(n)) { used.add(n); return n; } } };
const AG = []; let n = 0;
LOBS.forEach(l => {
  const tl = newName(), pats = PAT_BY_LOB[l.key];
  for (let i = 0; i < l.hc; i++, n++) {
    const name = newName();
    AG.push({ id: 'E' + (2001 + n), name, acc: l.acc, lob: l.lob, key: l.key, tl,
      email: name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(' ', '.') + '@leangroup.com',
      pat: [{ from: ANCHOR, p: pats[i % pats.length], off: Math.floor(i / pats.length) % 2 }],
      lateP: R() < .18 ? .2 + R() * .15 : .04 + R() * .07,
      absP: R() < .14 ? .07 + R() * .05 : .016 + R() * .022 });
  }
});
const AGI = Object.fromEntries(AG.map(a => [a.id, a]));
const TLS = [...new Set(AG.map(a => a.tl))];

/* ---------- schedule ---------- */
const OV = {};                              // overrides keyed "agent|date"
const PUBOK = {};                           // "agent|date" -> ms when Shifts last confirmed the tool's version (or the tool took Shifts' version)
const kOf = (id, d) => id + '|' + d;
const patOn = (a, d) => { let p = a.pat[0]; for (const x of a.pat) if (x.from <= d) p = x; return p; };
const weekOf = (a, d) => { const p = patOn(a, d); return ((Math.floor(diffD(ANCHOR, d) / 7) + p.off) % 2 + 2) % 2; };
/* Shifts is the source for published weeks. Beyond that, each agent's last published week repeats ("auto-roll")
   until something changes. A pattern assigned to start later than the horizon still wins. */
const PUB = { until: addD(weekStart(TODAY), 13), captured: TODAY + ' ' + hm(Math.max(0, realMin() - 9)), rollDay: 'Thursday', rollTime: '18:00', auto: true };
const isProjected = (d, a) => a && a.cap ? d > a.cap.last : d > PUB.until;
function baseCode(a, d) {
  if (a.cap) { if (d < a.cap.first || (a.cap.stop && d > a.cap.last)) return 'OFF'; const dd = d > a.cap.last ? addD(d, -7 * Math.ceil(diffD(a.cap.weekEnd, d) / 7)) : d; return (d > a.cap.last && PLAN[kOf(a.id, dd)] ? PLAN[kOf(a.id, dd)].code : a.cap.codes[dd]) || 'OFF'; }
  const p = patOn(a, d);
  if (d > PUB.until && PUB.auto && p.from <= PUB.until) return baseCode(a, addD(d, -7 * Math.ceil(diffD(PUB.until, d) / 7)));
  const P = PATTERNS[p.p]; return P.w.length === 7 ? P.w[dow(d)] : P.w[weekOf(a, d) * 7 + dow(d)];
}
function sched(a, d) {
  const o = OV[kOf(a.id, d)] || {}, base = baseCode(a, d), code = o.code || base, sh = SHIFTS[code];
  return { a, d, code, base, working: code !== 'OFF', s: sh.s, e: sh.e, absence: code !== 'OFF' ? (o.absence || null) : null,
    acts: o.acts || [], remark: o.remark || '', shiftNote: o.shiftNote || '', swap: o.swap || null, changed: !!o.code && o.code !== base, week: weekOf(a, d) ? 'B' : 'A', pattern: patOn(a, d).p };
}

/* ---------- audit trail ---------- */
const AUD = [];
const AUD_HOOKS = [];                 // e.g. the database writer: every new audit entry is also saved server-side

      <input class="in" type="date" data-f="flDay" value="${FL.day}" max="${TODAY}" aria-label="Floor date">
      <button class="btn sm" data-a="flStep" data-v="-60" title="1 hour earlier">−1 h</button><input class="in" type="time" data-f="flTime" value="${hm(c)}" step="300" aria-label="Floor time"><button class="btn sm" data-a="flStep" data-v="60" title="1 hour later">+1 h</button>
      ${lastDay && lastDay !== FL.day ? `<button class="btn sm ghost" data-a="flLast" data-v="${lastDay}" title="Last day with clock-in data">Last data: ${fmtS(lastDay)}</button>` : ''}

function missingPanel(rows, c) {
  const nowFor = r => r.d === W.floor.day ? c : c + 1440;
  const miss = rows.filter(r => ['late','out','nologin'].includes(r.st)).map(r => ({ ...r, mins: r.st === 'late' ? nowFor(r) - r.s.s : r.st === 'out' ? nowFor(r) - r.ses[r.ses.length - 1].o : null }))
    .filter(r => r.st !== 'out' || r.mins > W.CFG.grace).sort((a, b) => (a.st === 'nologin') - (b.st === 'nologin') || (b.mins || 0) - (a.mins || 0));
  const soon = rows.filter(r => r.st === 'upcoming' && r.s.working && !r.s.absence && r.s.s - nowFor(r) <= 15 && r.s.s - nowFor(r) > 0).length;
  if (!miss.length) return `<div class="alarm clear"><h2>✓ Everyone scheduled right now is logged in</h2><p class="sub">${soon ? soon + ' agent' + (soon > 1 ? 's' : '') + ' start in the next 15 minutes.' : 'No shifts start in the next 15 minutes.'} Checked against ${esc(W.CFG.loginSource)} every 60 s.</p></div>`;
  return `<section class="alarm" aria-live="polite"><div class="panel-h"><div class="grow"><h2><span class="pulse"></span>Should be in, not logged in <span class="cntb">${miss.length}</span></h2>
      <p class="sub">Past their start time plus the ${W.CFG.grace}-min grace with no login, or logged out mid-shift. Team leads get a Teams alert automatically after ${W.NOTIFY.tlAlert} min. ${soon ? soon + ' more start in the next 15 min.' : ''}</p></div></div>

      <td>${stPill(r.st)}</td>

}

      <div class="top2"><span class="nm">${esc(a.name)}</span>${x.status === 'Pending' ? (v === 'short' ? vPill(v) : v === 'tight' ? '<span class="meta" title="Approving leaves the station exactly at its minimum">at minimum</span>' : '') : `<span class="pill ${x.status === 'Approved' ? 'ok' : 'bad'}">${x.status}</span>`}</div>
      <div class="meta">${lobName(a.key)} · ${esc(x.reason)} · ${fmtS(x.from)}${x.dates.length > 1 ? '–' + fmtS(x.to) : ''} · ${x.dates.length} day${x.dates.length > 1 ? 's' : ''}</div>

/* ---------- SCHEDULE ---------- */
const days14 = () => range(S.from, addD(S.from, 13));
function pSchedule() {
  const ds = days14(), lobs = W.LOBS.filter(lobOk);
  if (!lobs.some(l => l.key === S.lob)) S.lob = lobs[0].key;
  const drafts = W.SYNC.filter(j => j.status === 'Draft').length;
  const hdr = ds.map(d => `<th class="${d === TODAY ? 'today' : ''} ${W.isProjected(d) ? 'proj' : ''}" title="${W.isProjected(d) ? 'Projected: repeats the last published week' : 'Published in Shifts'}"><span class="wk">${W.DOW[dow(d)]}</span>${W.parse(d).getDate()}</th>`).join('');
  const heat = bySite(lobs, l => `<tr class="${l.key === S.lob ? 'selrow' : ''}"><td data-a="pickLob" data-v="${l.key}"><div class="nm">${esc(l.station || l.lob)}</div><div class="meta">${esc(l.site)} · ${l.hc} people</div></td>
    ${ds.map(d => { const c = W.cov(l.key, d), v = W.verdict(c.avail - c.pend, c.req); return `<td class="hc ${v}" data-a="dayCell" data-k="${l.key}" data-d="${d}" tabindex="0" title="${esc(l.name)} ${fmtD(d)}: ${c.avail} available (${c.sched} scheduled − ${c.off} off), ${c.pend} pending, ${c.req} required">${c.req ? c.avail + '<span style="opacity:.55;font-weight:500">/' + c.req + '</span>' : '—'}</td>`; }).join('')}</tr>`, 15);
  const ags = W.AG.filter(a => a.key === S.lob && !a.inactive);
  const rows = ags.map(a => `<tr><td><label style="display:flex;align-items:center"><span><span class="nm">${esc(a.name)}</span><div class="meta">${esc(W.PATTERNS[W.patOn(a, S.from).p].name)}</div></span></label></td>
    <td class="offc">${[0, 7].map(o => { const off = range(addD(S.from, o), addD(S.from, o + 6)).filter(d => !W.sched(a, d).working); return `<div>${o ? 'Wk 2' : 'Wk 1'}: <b>${off.length}</b> ${off.map(d => W.DOW[dow(d)]).join(' ') || '—'}</div>`; }).join('')}</td>

function readPlanFile(f, acc) {

    if (!raw.length) return toast('The sheet is empty');
    const ser = v => { if (v === '' || v == null) return null; if (typeof v === 'number') { let days = Math.floor(v + 1e-9), m = Math.floor((v - days) * 1440 + 1e-6); if (m >= 1440) { days++; m -= 1440; } return [days ? new Date(Date.UTC(1899, 11, 30) + days * 864e5).toISOString().slice(0, 10) : null, m]; }
      const s = String(v).trim(); let m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/); if (m) return [`${m[1]}-${W.pad(+m[2])}-${W.pad(+m[3])}`, m[4] ? +m[4] * 60 + +m[5] : null];
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/); if (m) return [`${m[3]}-${W.pad(+m[1])}-${W.pad(+m[2])}`, m[4] ? +m[4] * 60 + +m[5] : null];
      m = s.match(/^(\d{1,2}):(\d{2})/); return m ? [null, +m[1] * 60 + +m[2]] : null; };
    const hdr = Object.keys(raw[0]), find = re => hdr.find(x => re.test(x.toLowerCase().trim()));
    const c = { name:find(/^(employee name|employee|agent|agent name|name|full name)$/), date:find(/^(date|day|shift date)$/), start:find(/^(shift start time|start|start time|shift start)$/), end:find(/^(shift end time|end|end time|shift end)$/), shift:find(/^(shift|schedule|plan)$/) };
    if (!c.name || !c.date || !(c.start && c.end || c.shift)) return toast('Columns not found: need Name, Date and Start/End (or Shift)');
    const rows = raw.map(r => { const dd = ser(r[c.date]), d = dd && dd[0]; if (!d) return null; const at = v => { const x = ser(v); return x && x[1] != null ? [x[0] || d, x[1]] : null; };
      let st = null, en = null; if (c.start && c.end) { st = at(r[c.start]); en = at(r[c.end]); } else { const m = String(r[c.shift]).match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/); if (m) { st = [d, +m[1] * 60 + +m[2]]; en = [d, +m[3] * 60 + +m[4]]; } }

async function testDb() {
  const u = CONN.dbUrl.replace(/\/+$/, ''), h = { apikey:CONN.dbKey, Authorization:'Bearer ' + CONN.dbKey };
  const rows = []; let sync = '';
  try {
    for (const t of ['crane_pto_roster', 'crane_pto_requests', 'crane_pto_alloc', 'crane_pto_settings']) {
      const r = await fetch(`${u}/rest/v1/${t}?select=id&limit=1`, { headers:{ ...h, Prefer:'count=exact' } });
      rows.push([t, r.ok ? +((r.headers.get('content-range') || '*/0').split('/')[1]) || 0 : null]);
    }
    const s = await fetch(`${u}/rest/v1/crane_pto_alloc?id=eq.SYNC-STATUS&select=data,updated_at`, { headers:h });
    if (s.ok) { const j = await s.json(); if (j[0]) sync = new Date(j[0].updated_at).toLocaleString() + (j[0].data && j[0].data.matched != null ? ` · ${j[0].data.matched} people matched` : ''); }
    const ok = rows.some(r => r[1] != null);
    CONN.dbTest = { ok, rows, sync, at:new Date().toLocaleTimeString(), msg:ok ? '' : 'The database answered, but none of the crane_pto_* tables could be read with this key.' };
  } catch (e) { CONN.dbTest = { ok:false, rows, at:new Date().toLocaleTimeString(), msg:'Could not reach the database: ' + e.message + '. Check the URL, key and internet connection.' }; }
  W.audit('Settings', 'Database connection tested', u, '', CONN.dbTest.ok ? 'Connected' : 'Failed', ''); render();
}
async function testFlow() {
  try {
    const r = await fetch(CONN.flowUrl, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ action:'test', source:'Workforce Tool' }) });
    const txt = await r.text(); CONN.flowTest = { ok:r.ok, msg:r.ok ? 'Flow answered: ' + txt.slice(0, 120) : `Flow returned ${r.status}: ${txt.slice(0, 120)}`, at:new Date().toLocaleTimeString() };
  } catch (e) { CONN.flowTest = { ok:false, msg:'Could not reach the flow: ' + e.message, at:new Date().toLocaleTimeString() }; }
  W.audit('Settings', 'Shifts flow tested', 'Power Automate HTTP trigger', '', CONN.flowTest.ok ? 'OK' : 'Failed', ''); render();
}

document.addEventListener('keydown', e => {

  return `<section class="panel planning"><div class="panel-h"><div class="grow"><h2>Set an absence budget using active headcount</h2><p class="sub">Shrinkage means paid or scheduled time unavailable for normal work, such as leave, training or breaks. Set separate budgets for a site or a station. These percentages are management settings, not a volume forecast.</p></div>${DEV&&!DB.on?'<button class="btn sm" data-a="resetPractice">Reset practice settings & balances</button>':''}</div>
  <div class="planning-form"><label>Account<select class="in" data-f="budgetAccount" id="budgetAccount">${accs.map(a=>`<option value="${a.id}" ${acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label><label>Set budget for<select class="in" data-f="budgetScope"><option value="site" ${UX.budgetScope==='site'?'selected':''}>Site</option><option value="station" ${UX.budgetScope==='station'?'selected':''}>Station / team</option></select></label><label>Site or station<select class="in" id="budgetGroup" data-f="budgetGroup">${groups.map(([k,n])=>`<option value="${esc(k)}" ${k===selectedGroup?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
  ${[['leave','Planned leave %'],['unplanned','Unplanned absence %'],['training','Training / meetings %'],['breaks','Breaks / lunch %']].map(([k,n])=>`<label>${n}<input class="in" type="number" min="0" max="100" step="0.1" id="budget_${k}" value="${savedBudget?.[k]||0}" ${ed?'':'disabled'}></label>`).join('')}<button class="btn pri" data-a="budgetSave" ${ed?'':'disabled'}>Save budget</button></div>
  <div class="tw"><table><thead><tr><th>Site / station</th><th>Active people</th><th>Planned leave</th><th>Unplanned</th><th>Training</th><th>Breaks</th><th>Total budget</th><th>People equivalent</th><th></th></tr></thead><tbody>${show.map(x=>{const hc=budgetPeople(x).length,total=x.leave+x.unplanned+x.training+x.breaks;return `<tr><td>${esc(x.name)}<div class="meta">${x.scope==='site'?'Shared site budget':'Station budget'}</div></td><td>${hc}</td><td>${x.leave}%</td><td>${x.unplanned}%</td><td>${x.training}%</td><td>${x.breaks}%</td><td>${total}%</td><td>${(hc*total/100).toFixed(1)} unavailable · ${(hc*(100-total)/100).toFixed(1)} remaining</td><td>${ed?`<button class="btn sm" data-a="budgetApply" data-v="${esc(x.id)}">Use leave % as limit</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan="9">No budget set yet. Enter your own agreed percentages above.</td></tr>'}</tbody></table></div><p class="foot-note">People equivalent = active headcount × total budget %. It is a planning measure, not the number of people who left. “Use leave % as limit” applies only the planned-leave percentage to the leave rules below. Leave places from these budgets round down to whole people. A site limit is shared across its stations; a station-specific limit replaces that station’s share. Other percentages remain planning figures.</p></section>
  <section class="panel planning"><div class="panel-h"><div class="grow"><h2>Upload each person’s leave balance</h2><p class="sub">Import the latest entitlement balance for ${esc(W.ACC[acc].name)}. Match people by work email or employee ID. This is a reference balance; decisions do not automatically deduct it.</p></div><button class="btn" data-a="balanceTemplate">Download CSV template</button></div>
  ${UX.balanceLoadError?`<p class="note warn">${esc(UX.balanceLoadError)}</p>`:''}
  <div class="planning-form"><label>CSV or Excel file<input class="in" type="file" id="balanceFile" accept=".csv,.xlsx,.xls" data-f="balanceFile" ${ed?'':'disabled'}></label><p>Columns: Email or Employee ID, Leave Reason, Balance, Unit (days or hours), As Of (YYYY-MM-DD). Only rows for this account are accepted.</p></div>
  ${UX.balanceImport?`<div class="note"><b>Preview: ${UX.balanceImport.length} valid rows · ${UX.balanceErrors.length} rejected rows</b><p>Review the matched names below. Existing balances with the same person, reason and unit will be updated.</p>${UX.balanceErrors.length?`<ul>${UX.balanceErrors.slice(0,12).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="tw"><table><thead><tr><th>Person</th><th>Reason</th><th>Balance</th><th>As of</th></tr></thead><tbody>${UX.balanceImport.slice(0,20).map(r=>`<tr><td>${esc(W.AGI[r.person_id]?.name)}</td><td>${esc(r.reason)}</td><td>${r.balance} ${r.unit}</td><td>${r.as_of}</td></tr>`).join('')}</tbody></table></div><button class="btn pri" data-a="balanceCommit" ${UX.balanceImport.length?'':'disabled'}>Save valid balances</button><button class="btn" data-a="balanceCancel">Cancel import</button></div>`:''}
  <div class="tw" style="max-height:280px"><table><thead><tr><th>Person</th><th>Station</th><th>Leave reason</th><th>Remaining balance</th><th>As of</th></tr></thead><tbody>${balances.map(x=>`<tr><td>${esc(W.AGI[x.person_id].name)}</td><td>${esc(W.AGI[x.person_id].station||W.AGI[x.person_id].lob)}</td><td>${esc(x.reason)}</td><td>${x.balance} ${x.unit}</td><td>${esc(x.as_of)}</td></tr>`).join('')||'<tr><td colspan="5">No leave balances loaded for this account.</td></tr>'}</tbody></table></div></section>`;
}
function balanceNote(a,reason) {const rows=OPS.balances.filter(x=>x.person_id===a.id&&x.reason===reason);return `<div class="note" style="margin-top:16px"><b>Imported balance for this leave reason</b><p>${rows.length?rows.map(x=>esc(x.balance+' '+x.unit+' remaining as of '+x.as_of)).join(' · '):'No balance imported for '+esc(reason)+'.'} Reference only; approvals do not automatically deduct it.</p></div>`;}
function budgetPeople(x) { return W.AG.filter(a=>!a.inactive&&a.acc===x.account&&(x.scope==='site'?W.locOf(a)===x.group:a.key===x.group)); }
function accessChecklist(u) {
  const role=u?.role || 'RTA', chosen=OPS.pages[u?.email], pages=PAGES.filter(([k])=>!['home','help'].includes(k));
  return `<fieldset class="access-checks"><legend>Pages this person can open</legend><p>Tick the pages they need. A page must also be allowed by the selected role. The role still controls database access and actions.</p>${pages.map(([k,n])=>`<label><input class="uPage" type="checkbox" value="${k}" ${roleCan(role,k)&&(!chosen||chosen.includes(k))?'checked':''} ${roleCan(role,k)?'':'disabled'}> ${esc(n)}</label>`).join('')}<p class="meta">Start here and How to use this tool remain available to every approved user.</p></fieldset>`;
}
async function saveAccessChecklist(email,role) { OPS.pages[email.toLowerCase()]=[...document.querySelectorAll('.uPage:checked')].map(x=>x.value).filter(k=>roleCan(role,k)); W.audit('Access','Updated page checklist',email,'',OPS.pages[email.toLowerCase()].join(', '),'Within existing role permissions'); return saveOps(); }
function parseBalanceRows(rows,acc) {
  const valid=[], errors=[],seen=new Set();
  rows.forEach((r,i)=>{const get=(...names)=>{const k=Object.keys(r).find(k=>names.includes(k.trim().toLowerCase()));return k==null?'':r[k] instanceof Date ? r[k].getFullYear()+'-'+String(r[k].getMonth()+1).padStart(2,'0')+'-'+String(r[k].getDate()).padStart(2,'0') : String(r[k]).trim();};
    const email=get('email','work email').toLowerCase(), id=get('employee id','id'), reason=get('leave reason','reason'),raw=get('balance','remaining balance'),balance=Number(raw), unit=get('unit').toLowerCase(), as_of=get('as of','as_of');
    const people=W.AG.filter(a=>!a.inactive&&a.acc===acc && ((email&&a.email?.toLowerCase()===email)||(id&&(a.id===id||String(a.empId||a.rosterRow?.empId||'')===id))));
    const fail=m=>errors.push('Row '+(i+2)+': '+m);
    if(people.length!==1) return fail('No unique active person matched in the selected account.');
    if(!W.RCFG[reason]) return fail('Unknown leave reason "'+reason+'". Add it under Absence reasons first.');
    if(raw===''||!Number.isFinite(balance)||balance<0) return fail('Balance must be a non-negative number.');
    if(!['days','hours'].includes(unit)) return fail('Unit must be days or hours.');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(as_of)||isNaN(Date.parse(as_of))||new Date(as_of+'T00:00:00Z').toISOString().slice(0,10)!==as_of) return fail('As Of must be a valid YYYY-MM-DD date.');
    const key=people[0].id+'|'+reason+'|'+unit;if(seen.has(key))return fail('Duplicate person, reason and unit in this file.');seen.add(key);
    valid.push({person_id:people[0].id,account_id:acc,reason,unit,balance,as_of});
  }); return {valid,errors};
}
async function readBalanceFile(file) {
  if(!file || !isAdmin()) return;
  const acc=$('budgetAccount').value;
  if(!window.XLSX) return toast('Excel reader unavailable. Please reload while online.');
  try { const wb=XLSX.read(await file.arrayBuffer(),{type:'array',raw:true,cellDates:true}), rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true}),r=parseBalanceRows(rows,acc);UX.balanceImport=r.valid;UX.balanceErrors=r.errors;render(); }
  catch(e){toast('Could not read file: '+e.message);}
}
function reasonDrawer() { if(!isAdmin()) return;open('Add absence reason',`<p class="note">This adds a reason to the tool. It does not create a time-off reason in Teams Shifts.</p><label class="field">Reason name<input class="in" id="reasonName" maxlength="80"></label><label class="field">Short code<input class="in" id="reasonCode" maxlength="8" placeholder="2–8 letters or numbers"></label><label class="field">Type<select class="in" id="reasonType"><option value="planned">Planned</option><option value="unplanned">Unplanned</option></select></label><label><input type="checkbox" id="reasonAbs" checked> Count in absence percentage</label><br><label><input type="checkbox" id="reasonSlot" checked> Use a planned-leave place</label><br><label><input type="checkbox" id="reasonPartial"> Part of a day</label>`,'<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="reasonSave">Add reason</button>'); }
Object.assign(A,{
  resetPractice:()=>{if(!DEV||DB.on)return;localStorage.removeItem('wft.demo.ops');localStorage.removeItem('wft.demo.balances');location.reload();},
  spkApply:el=>{const n=el.dataset.v,R=SPK[n],v=UX.pickerDraft||[];if(R.min&&!v.length)return toast('Choose at least one station.');R.set(v);S.spk=null;UX.pickerDraft=null;render();$('spkTrigger_'+n)?.focus();},
  reasonNew:reasonDrawer,
  reasonSave:async()=>{try{const r={k:$('reasonName').value,code:$('reasonCode').value,type:$('reasonType').value,abs:$('reasonAbs').checked,slot:$('reasonSlot').checked,partial:$('reasonPartial').checked};W.addReason(r);OPS.reasons=W.REASONS.map(x=>({...x}));if(await saveOps()){close();toast('Reason added to this tool.');render();}}catch(e){toast(e.message);}},
  budgetSave:async()=>{if(!isAdmin())return;const account=$('budgetAccount').value,group=$('budgetGroup').value;if(!group)return toast('Choose a site or station.');const nums=Object.fromEntries(['leave','unplanned','training','breaks'].map(k=>[k,Number($('budget_'+k).value)]));if(Object.values(nums).some(v=>!Number.isFinite(v)||v<0||v>100)||Object.values(nums).reduce((a,b)=>a+b,0)>100)return toast('Each percentage must be 0–100 and the total cannot exceed 100%.');const id=account+'|'+UX.budgetScope+'|'+group,row={id,account,scope:UX.budgetScope,group,name:$('budgetGroup').selectedOptions[0].textContent,...nums},i=OPS.budgets.findIndex(x=>x.id===id);if(i<0)OPS.budgets.push(row);else OPS.budgets[i]=row;W.audit('Settings','Saved absence budget',row.name,'',JSON.stringify(nums),'Active headcount basis');if(await saveOps()){toast('Budget saved.');render();}},
  budgetApply:async el=>{if(!isAdmin())return;const x=OPS.budgets.find(x=>x.id===el.dataset.v),keys=[...new Set(budgetPeople(x).map(a=>a.key))];if(!keys.length)return toast('No active people in this budget.');if(x.scope==='station') Object.values(W.ALLOC).forEach(r=>{if(r.scopeKeys)r.scopeKeys=r.scopeKeys.filter(k=>!keys.includes(k));});for(const k of keys)W.setAlloc(k,{method:'budget',pct:x.leave,min:0,hold:true,scope:x.scope,scopeKeys:x.scope==='site'?keys:undefined,scopeLabel:x.name});OPS.allocations=JSON.parse(JSON.stringify(W.ALLOC));if(await saveOps()){toast('Planned-leave limit applied.');render();}},
  balanceTemplate:()=>{const acc=$('budgetAccount').value,a=W.AG.find(a=>!a.inactive&&a.acc===acc);W.ui.csv('leave-balance-template.csv',[['Email','Employee ID','Leave Reason','Balance','Unit','As Of'],[a?.email||'person@example.com','','Vacation',0,'days',TODAY]]);},
  balanceCancel:()=>{UX.balanceImport=null;UX.balanceErrors=[];render();},
  balanceCommit:async()=>{if(!isAdmin()||!UX.balanceImport?.length)return;const rows=UX.balanceImport.map(x=>({...x,updated_at:new Date().toISOString()}));if(DB.on){const {error}=await DB.sb.from('wft_leave_balances').upsert(rows,{onConflict:'person_id,reason,unit'});if(error)return toast('Balances not saved: '+error.message+' · database setup may be needed.');await loadBalances();}else{const map=new Map(OPS.balances.map(x=>[x.person_id+'|'+x.reason+'|'+x.unit,x]));rows.forEach(x=>map.set(x.person_id+'|'+x.reason+'|'+x.unit,x));OPS.balances=[...map.values()];localStorage.setItem('wft.demo.balances',JSON.stringify(OPS.balances));}W.audit('Settings','Imported leave balances',rows[0].account_id,'',rows.length+' balances','Reference only; not deducted automatically');UX.balanceImport=null;UX.balanceErrors=[];toast(rows.length+' balances saved.');render();}
});
document.addEventListener('change',e=>{const k=e.target.dataset.f;if(k==='hourlyReference'){const n=Number(e.target.value);if(!Number.isInteger(n)||n<0||n>9999)return toast('Enter a whole number from 0 to 9999.');if(!isAdmin())return;OPS.hourlyReferences[e.target.dataset.k]=n;W.LOB[e.target.dataset.k].minInt=n;W.audit('Settings','Hourly reference changed',e.target.dataset.k,'',n,'Not volume based');saveOps();render();}if(k==='displayZone'){W.setDisplayZone(e.target.value);localStorage.setItem('wft.displayZone',e.target.value);render();}if(k==='budgetAccount'){UX.budgetAccount=e.target.value;UX.balanceImport=null;UX.balanceErrors=[];render();}if(k==='budgetScope'){UX.budgetScope=e.target.value;UX.budgetGroup=null;render();}if(k==='budgetGroup'){UX.budgetGroup=e.target.value;render();}if(k==='balanceFile')readBalanceFile(e.target.files[0]);if(e.target.id==='uR'){const role=e.target.value;document.querySelectorAll('.uPage').forEach(x=>{x.disabled=!roleCan(role,x.value);if(x.disabled)x.checked=false;});}});
// The clock is a display preference, never an account publishing setting.
try {const z=localStorage.getItem('wft.displayZone');if(z)W.setDisplayZone(z);if(DEV){applyOps(JSON.parse(localStorage.getItem('wft.demo.ops')||'null'));OPS.balances=JSON.parse(localStorage.getItem('wft.demo.balances')||'[]');}}catch(e){console.warn('Saved review preferences could not be loaded.');}

render();
</script>
